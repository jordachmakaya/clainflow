sonar.organization=jordachmakaya
sonar.projectKey=jordachmakaya_clainflow

# Seule l'API est couverte par le rapport : infra/ a ses propres tests, sans LCOV.
sonar.sources=src
sonar.tests=test
sonar.exclusions=src/generated/**
sonar.sourceEncoding=UTF-8

# Produit par `pnpm run test:coverage`, à lancer avant le scanner.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
