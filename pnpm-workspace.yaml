# Le dépôt contient 2 paquets : l'API (racine) et l'infrastructure AWS (infra/).
packages:
  - infra

# Source unique des versions : les package.json y font référence avec "catalog:".
catalog:
  '@hardmachinelabs/env-sync': ^1.0.1
  '@hardmachinelabs/zod-config': ^0.2.0
  '@types/express': ^5.0.6
  '@types/node': ^22.20.5
  '@types/supertest': ^7.2.1
  '@vitest/coverage-v8': ^4.1.12
  aws-cdk: ^2.1146.1
  aws-cdk-lib: ^2.274.0
  constructs: ^10.8.1
  express: ^5.3.0
  helmet: ^8.3.0
  oxlint: ^1.89.0
  oxlint-tsgolint: ^7.0.2005
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.2.0
  prettier: ^3.9.10
  supertest: ^7.3.1
  tsx: ^4.23.15
  typescript: ^6.0.3
  vitest: ^4.1.12
  zod: ^4.6.7

# pnpm 10+ ne lance plus les scripts d'installation des dépendances sans autorisation explicite.
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
