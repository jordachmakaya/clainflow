name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1' # chaque lundi : de nouvelles requêtes peuvent trouver des failles dans un code inchangé

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # envoie les résultats dans l'onglet Security
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none # CodeQL lit les sources : pas besoin d'installer ni de compiler
          config: |
            paths-ignore:
              - test # applications de test et mots de passe factices : uniquement des faux positifs
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
