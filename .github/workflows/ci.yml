name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # vide sur une PR de fork : l'analyse est alors sautée
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube Cloud a besoin de l'historique complet
      - uses: pnpm/action-setup@v6 # version de pnpm lue dans "packageManager" (package.json)
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run db:generate # src/generated/prisma n'est pas versionné
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm --filter infra run typecheck # l'infra aussi est du code
      - run: pnpm run test:coverage
      - run: pnpm run test:unit # les calculs de dates ne doivent pas dépendre du fuseau du serveur
        env:
          TZ: Pacific/Kiritimati # UTC+14 : le plus loin possible du fuseau UTC de la CI
      - run: pnpm --filter infra run test # vérifie le template CloudFormation généré
      - run: pnpm run build
      - name: SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v8.4.0
