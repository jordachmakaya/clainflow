version: 2

updates:
  - package-ecosystem: npm # couvre aussi pnpm : le dépôt est détecté grâce à pnpm-lock.yaml
    directories: ['/', '/infra']
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # laisse le temps de repérer une version compromise, ne retarde pas les correctifs de sécurité
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '@types/node' # suit la version majeure de Node, changée à la main avec .nvmrc et le Dockerfile
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node # même raison que @types/node
        update-types: [version-update:semver-major]
